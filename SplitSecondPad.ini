; glimpse_fix - Split/Second PC fix (dinput8.dll)
; Every option is read when the game starts. 1 = on, 0 = off unless noted otherwise.

; ============================================================================================ controller
[Controller]
; XInput slots presented to the game as Xbox 360 pads (0-4). The game takes at most 4 joysticks,
; lower this if a wheel or other DirectInput device must fit in as well.
; At 0 the per-frame extras (photo mode, HUD and zoom keys, unlocks, boost, LOD and pop-in fixes)
; do not run, as they run with the pads' poll.
VirtualPads=4
; Remove the real XInput controllers from DirectInput so they do not show up twice.
HideXInputFromDirectInput=1
; 1 = LT and RT on separate axes (brake and throttle at the same time). 0 = shared Z axis like the stock driver.
SeparateTriggers=1
; Radial stick deadzone and trigger deadzone, 0.0 - 1.0
StickDeadzone=0.15
TriggerDeadzone=0.05
; Rumble multiplier (0 = off, 1 = as the game sends it)
RumbleStrength=1.0
; Prompt bar icons while the controller is in use: xbox, playstation or keyboard (= never switch)
ButtonGlyphs=xbox

; ============================================================================================== graphics
[Graphics]
; 60 = 60 fps with the simulation stepped exactly as before (one 1/60 s tick per frame), 30 = stock
FrameRate=60
; Internal render resolution as a factor of the screen resolution, independent of the in-game
; graphics option. "auto" = as the game does it: 2.0 at "Very High", 1.0 below. Very High is
; exactly High plus 2x supersampling, so e.g. Very High with RenderScale=1.0 costs like High.
; Range 0.5 - 4.0 (1.5 = 2.25x the pixels, 2.0 = 4x). The frame is scaled to the screen with
; a linear filter. Heavy at 4K: 2.0 renders 7680x4320.
RenderScale=auto
; Anisotropic texture filtering, 2 - 16 (0 = as the game, which uses plain linear filtering)
Anisotropy=16
; Motion blur multiplier (the game enables it per camera at graphics quality High/Very High).
; At FrameRate=60 the blur is doubled automatically so it looks like at 30 fps. 0 = off.
MotionBlurStrength=1.0
; Darkened screen edges set by the race cameras: 0 = off, 1 = as the game
Vignette=0
; The cameras' screen gradient, the translucent blue band at the top of the screen. 0 = off
Gradient=1
; Bloom (glow around bright areas): 1 = as the game, 0 = off (the frame is still tone mapped)
Bloom=1
; Bloom look, multiplied on top of each camera's values (1.0 = as the game, 0 - 10). They are read
; again every 2 seconds, so you can change them while the game runs (Alt+Tab, edit, save).
;   BloomStrength  glow on bright areas
;   BloomTone      second bright pass value, softer effect
;   BloomCurve     how the glow is added (below 1.0 has no effect)
;   Exposure       brightness of the whole picture
BloomStrength=1.0
BloomTone=1.0
BloomCurve=1.0
Exposure=1.0
; Lens flares of the sun and lights, including the screen space flare: 1 = as the game, 0 = off
LensFlare=1
; Flares of sparks, explosions and lights: 1 = as the game, 0 = off
ParticleFlare=1
; The PC port scales the powerplay icons over the cars and the route change markers twice above
; 1280 pixels width (3x at 4K). 1 = console size at every resolution, 0 = stock
FixPowerplayIconSize=1

; ================================================================================================= world
[World]
; Sector streaming pool in MB (stock 57). A bigger pool keeps the sharp textures loaded instead of
; falling back to blurry/grey ones. Only used when SplitSecond.exe has the LAA flag (4 GB address space).
StreamPoolMB=512
; Distance multiplier for the high and mid environment LODs, sector and object streaming (400 m),
; particles, debris and the powerplay objects (levels set them, e.g. 150/300 m, terminal 300 m).
; The low LOD hand-over to the backdrop models stays as the level sets it.
LodDistanceScale=2.0
; Buildings and objects are only drawn when the current track section's precomputed
; visibility list names them, so they pop in at section borders whatever their distance.
; 1 = ignore the lists (distance and view decide; a little more to draw), 0 = as the game
PopInFix=1

; ================================================================================================ camera
[Camera]
; Field of view of the race cameras (chase and bumper), as a factor of the game's own: 1.2 = 20 %
; wider, 0.8 = narrower. The game still widens the view with speed on top of it. 1.0 = as the game
FOV=1.0
; Screens wider than 16:9 (21:9, 32:9): widen the view so the picture keeps the height of 16:9,
; instead of cutting off the top and bottom. Has no effect on 16:9 and narrower screens.
UltrawideFix=1
; Zoom the race camera while a key is held: ZoomInKey closer, ZoomOutKey wider, ZoomResetKey back
; to FOV. Keys are virtual key codes: 0x31 = 1, 0x32 = 2, 0x33 = 3 (top row). 0 = off
ZoomKeys=0
ZoomInKey=0x31
ZoomOutKey=0x32
ZoomResetKey=0x33
; Photo mode: during a race, PhotoModeKey (0x46 = F) or the pad's Back button holds the world still,
; hides the HUD and the on-screen messages and frees the camera. Left stick / W A S D move, right
; stick / I J K L look, triggers / Q E down and up, A / Shift faster, LB RB / zoom keys zoom, Y + LB RB
; / U O tilt. D-pad / arrow keys: up and down focus distance, left and right depth of field (left end
; = off); with X / Ctrl held: up and down bloom, left and right exposure; left stick click / Backspace
; resets the look (up and down switch the depth of field on when it is off). No car is put back on
; the track meanwhile. Back, B, Esc or PhotoModeKey again: back to the race. Keys the game uses itself
; (Esc, P, Enter, arrows) do not work as PhotoModeKey.
; Once your car is wrecked the crash sequence decides the view: on a crash on the road the camera
; stays tied to the car, after leaving the track (falls) it cannot be taken over at all. Enter the
; photo mode before the crash for a free camera.
PhotoMode=0
PhotoModeKey=0x46
; Switch the HUD off and on during a race with this key (0x48 = H). 0 = no key
HudKey=0

; ============================================================================================== gameplay
[Gameplay]
; Everything selectable without career progress: all tracks, events, episodes, game modes and
; vehicles (the game's own debug switches; the profile is not changed). 0 = as the game
UnlockAll=0
; The extras the PC version unlocks with cheat codes: the Expressway track, the Cobretti SlipStream,
; the retailer branded cars and the Euro livery pack. 0 = as the game (codes still work)
BonusContent=0
; Achievements and with them the decals: 1 = all of them, 2 = only the ones that cannot be earned any
; more (the six from ranked online races and the Pure decal; the "all achievements" one follows once
; the rest is earned). Unlocked in the next single player race; achievements are saved with the profile
; and stay when this is set back to 0, the Pure decal is shown while this is on. The profile files are
; copied to glimpse_backup before the first unlock. 0 = as the game
UnlockDecals=0
; HIGHLY EXPERIMENTAL: can softlock the game, especially together with the photo mode.
; Seconds from a crash of yours (crashes, takedowns, power plays) to the respot; the crash camera
; keeps showing the wreck until then.
; The photo mode holds the respot anyway while it is on. 0 = as the game
WreckTime=0
; Boot movies at every start: 0 = as the game, 1 = skip the publisher logo, 2 = skip the logo and the intro
SkipIntro=0

; --- boost
; X or BoostKey held: player 1 gets extra speed along the car's heading (only while driving
; forward), up to BoostMaxSpeed (m/s; 90 = 324 km/h) with BoostAcceleration (m/s^2; 15 = about
; 1.5 g). Motion blur rises to BoostMotionBlur times its strength while boosting (1 - 5).
Boost=0
; Keyboard key for the boost, a virtual key code: 0xA0 = left Shift (not used by the game).
; 0 = pad only
BoostKey=0xA0
BoostAcceleration=15
BoostMaxSpeed=90
BoostMotionBlur=3.0
; LS+RS (both sticks pressed) or PowerBarFillKey: power play bar full. The key is a virtual key
; code: 0xA2 = left Ctrl (not used by the game), 0 = pad only
PowerBarFill=0
PowerBarFillKey=0xA2

; --- AI boost (EXPERIMENTAL)
; AI cars boost too, in bursts while they are behind player 1 or not far ahead.
; BoostAcceleration and BoostMaxSpeed apply to them as well.
AIBoost=0
; 1 = easy (0.8x your boost, 3 s tank, now and then, up to 30 m ahead)
; 2 = normal (1x, 5 s tank, about once a second, up to 60 m ahead)
; 3 = hard (1.3x, 8 s tank, almost constantly, up to 150 m ahead)
AIBoostLevel=2
; 1 = the tank never empties, 0 = limited, refilled over time
AIBoostUnlimited=0
; 1 = only on straights at speed, 0 = anywhere while driving forward (also in corners)
AIBoostStraightOnly=1
; 1 = chaos mode: every AI car boosts all the time, everywhere, also far ahead of you, with an
; endless tank, the AI's power play bar is always full and the AI drives at its highest skill. While this is 1, AIBoostLevel, AIBoostUnlimited and AIBoostStraightOnly do not apply.
AIBoostChaos=0

; ================================================================================================= debug
[Debug]
; Write SplitSecondPad.log next to the game
Log=0
