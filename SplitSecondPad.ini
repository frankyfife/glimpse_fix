; Split/Second controller fix (dinput8.dll proxy)
[Controller]
; XInput slots presented to the game as Xbox 360 pads (0-4). The game takes at most 4 joysticks,
; lower this if a wheel or other DirectInput device must fit in as well.
VirtualPads=4
; Remove the real XInput controllers from DirectInput so they do not show up twice.
HideXInputFromDirectInput=1
; 1 = LT and RT on separate axes (brake and throttle at the same time). 0 = shared Z axis like the stock driver.
SeparateTriggers=1
; Radial stick deadzone and trigger deadzone, 0.0 - 1.0
StickDeadzone=0.15
TriggerDeadzone=0.05
; Rumble multiplier (0 = off, 1 = as the game sends it)
RumbleStrength=1.0
; Prompt bar icons while the controller is in use: xbox, playstation or keyboard (= never switch)
ButtonGlyphs=xbox
; Write SplitSecondPad.log next to the game
Log=0

[Game]
; 60 = 60 fps with the simulation stepped exactly as before (one 1/60 s tick per frame), 30 = stock
FrameRate=60
; Sector streaming pool in MB (stock 57). A bigger pool keeps the sharp textures loaded instead of
; falling back to blurry/grey ones. Only used when SplitSecond.exe has the LAA flag (4 GB address space).
StreamPoolMB=512
; The PC port scales the powerplay icons over the cars twice above 1280 pixels width (3x at 4K).
; 1 = console size at every resolution, 0 = stock
FixPowerplayIconSize=1
; Motion blur multiplier (the game enables it per camera at graphics quality High/Very High).
; At FrameRate=60 the blur is doubled automatically so it looks like at 30 fps. 0 = off.
MotionBlurStrength=1.0
